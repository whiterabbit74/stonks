name: Go checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      # -race: в реестре аудитов несколько находок про гонки на общей строке
      # позиции (AUD-103, AUD-112). Без флага CI их не поймает.
      - run: TZ=UTC go test -race ./...
      - run: TZ=Pacific/Auckland go test ./...
      - run: go vet ./...
