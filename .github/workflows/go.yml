name: Go checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: TZ=UTC go test ./...
      - run: TZ=Pacific/Auckland go test ./...
      - run: go vet ./...
