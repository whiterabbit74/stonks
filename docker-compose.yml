services:
  server:
    image: ${SERVER_IMAGE:-stonks-server:current}
    env_file:
      - /home/ubuntu/stonks-config/.env
    environment:
      - PORT=3001
      - GOAPP_ROOT=/app
      - GO_ENV=production
      - BUILD_ID=${BUILD_ID:-dev}
      # Caddy is the only hop in front of this service, so the rightmost
      # X-Forwarded-For entry is trustworthy and rate limiting keys on the
      # real client IP. Leave unset anywhere the server is directly exposed.
      - TRUST_PROXY=true
      # ADMIN_PASSWORD must be set in env_file. An empty password must not open
      # the API; fail-closed is enforced in the HTTP layer. This compose marks
      # the process as production so a missing password cannot disable auth.
      # WEBULL_ENABLE_LIVE_TEST_BUY and ROBINHOOD_ENABLE_LIVE_TEST_BUY are
      # opt-in via env_file only (unset = disabled).
      - DB_FILE=/data/db/trading.db
      - DATASETS_DIR=/data/datasets
      - HTTP_LOG_PATH=/data/state/http-access.jsonl
    volumes:
      - stonks_datasets:/data/datasets
      - stonks_db:/data/db
      - stonks_state:/data/state
    ports:
      # Loopback only: Caddy reaches this service on the docker network.
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512
    cpus: "1.5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    container_name: stonks-server

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    # Own secrets file. The trading env_file above holds ADMIN_PASSWORD, the
    # Telegram token and the broker keys; this container only needs its bearer
    # tokens, so it must not see the rest. Create it on the VPS:
    #   printf 'MCP_BEARER_TOKENS=...\n' > /home/ubuntu/stonks-config/mcp.env
    #   chmod 600 /home/ubuntu/stonks-config/mcp.env
    env_file:
      - /home/ubuntu/stonks-config/mcp.env
    environment:
      - MCP_ADDR=:8080
      - MCP_ENDPOINT_PATH=/mcp/transcribe/
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-https://chatgpt.com,https://chat.openai.com,https://mktorder.com}
    expose:
      - "8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.35"
    healthcheck:
      test: ["CMD", "/mcp-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    container_name: stonks-mcp

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      # TCP-only 443 so UDP/443 stays free for the host VPN (AmneziaWG).
      # Docker maps TCP by default when no /udp suffix is given, which also
      # keeps Caddy from grabbing UDP/443 for HTTP/3.
      - "443:443"
    depends_on:
      - server
      - mcp
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-mktorder.com}
      - TLS_CA=${TLS_CA:-https://acme-v02.api.letsencrypt.org/directory}
    restart: unless-stopped
    # This is the container facing the internet and it had no limits at all,
    # while the service behind it did. NET_BIND_SERVICE is kept because Caddy
    # binds 80/443; read_only is deliberately not set, Caddy writes its
    # certificate and OCSP state outside the mounted volumes.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    container_name: stonks-caddy

volumes:
  stonks_datasets:
  stonks_db:
  stonks_state:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
